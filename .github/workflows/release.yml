# Builds the APK on every push to main (or by hand from the Actions tab) and
# publishes it as a GitHub release. The app's "Check for updates" finds it and
# installs it, so no cable needed. Needs the DEBUG_KEYSTORE_B64 secret (the same
# key as running-app): see docs/SETUP.md.
name: Release APK

on:
  push:
    branches: [main]
    # Only app changes make a new release
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "worker/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is the commit count, so it needs the whole history
          fetch-depth: 0

      - name: Restore the signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Add the DEBUG_KEYSTORE_B64 secret first (docs/SETUP.md). Without your key, the phone refuses the update."
            exit 1
          fi
          mkdir -p .android-user
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > .android-user/debug.keystore

      # Firebase config for push alerts. Optional: without it the APK builds
      # with no push, and the build log says so.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::warning::No GOOGLE_SERVICES_JSON_B64 secret: this APK has no push alerts (docs/SETUP.md)"
          else
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          fi

      - uses: actions/cache@v4
        with:
          path: .gradle-cache
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Test and build
        env:
          GRADLE_CACHE: ${{ github.workspace }}/.gradle-cache
        run: docker/build-apk.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.$(git rev-list --count HEAD)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "flights-$tag.apk"
          git log -1 --pretty=%B > notes.txt
          gh release create "$tag" "flights-$tag.apk" --target "$GITHUB_SHA" \
            --title "Flights $tag" --notes-file notes.txt
