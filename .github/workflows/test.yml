# Backend tests and type check on every push and pull request.
name: Test backend

on:
  push:
    paths: ["worker/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["worker/**"]

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
