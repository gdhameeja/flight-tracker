# Flight Tracker backend. Secrets (APP_TOKEN, AERODATABOX_KEY) are set with
# `npx wrangler secret put NAME`, never written here: this repo is public.
name = "flight-tracker"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Checks the flights that are due every 5 minutes (see src/schedule.ts)
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "flight-tracker"
database_id = "ea5138c8-075a-4194-952d-825aa25399ed"

[observability]
enabled = true
